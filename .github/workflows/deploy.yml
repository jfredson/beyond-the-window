# Deploys beyondthewindow.org on every push to main that could change the site, the same
# pattern as The Quiet Galaxy and The Belt Equation (added there 2026-09-19). John ruled this
# on 2026-11-19 (docs/rulings/2026-11-19-every-push-publishes.md). Needs two repository
# secrets, which John sets himself: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus the
# zone's Workers Routes: Edit) and CLOUDFLARE_ACCOUNT_ID. Until they exist the workflow fails
# at the deploy step and nothing is published. The first release is John setting them and
# giving his go.
#
# Any check that fails stops the run before the deploy step, so a push that breaks a rule of
# the records or of public text publishes nothing and the site simply stays as it was.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# The job reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check the records and the headline file
        run: python3 scripts/compute.py --check
      - name: Run the tests of the record check and the export
        run: python3 scripts/test_compute.py
      # The build runs the record check and the export again before it starts, and the check of
      # the built site after it ends (the "prebuild" and "postbuild" lines in site/package.json).
      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Check the built site against the rules of public text
        run: python3 scripts/check_site.py --dist site/dist
      # The step itself is "wrangler-action@v3", as on all five sibling sites. The version of
      # Cloudflare's deploy tool (wrangler) is named here because this site's package files do
      # not list the tool. It is the version in The Quiet Galaxy's lock file on 2026-11-19, so
      # both sites deploy with the same tool.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.151.1"
          command: deploy
      # Tells the parent site (sentient-horizons.com) to rebuild, so its Projects page reads this
      # site's new headline straight away instead of at the next build or the Monday refresh
      # (ruled by John 2026-10-19). Needs the repository secret CLOUDFLARE_DEPLOY_HOOK, the
      # address of the parent's Cloudflare deploy hook. Without it the step only warns, so the
      # deploy above is never held up by it.
      - name: Rebuild the Projects page on sentient-horizons.com
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "::warning::The repository secret CLOUDFLARE_DEPLOY_HOOK is not set, so the Projects page on sentient-horizons.com was not told to rebuild. It will show this site's new number at its next build or the Monday refresh."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 --request POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
          echo "Called the parent's deploy hook; sentient-horizons.com is rebuilding its Projects page."
