# The sealed capture: what is asked, of which models, by when, and up to what cost.
#
# Written 2026-11-18 by Claude (Fable 5.2), an AI model. This file is data. The script
# (capture.py) reads it and cannot change it. Every figure here is also checked by the script
# against the document it came from, and the script refuses to start if the two differ:
#
#   - each last safe day, against the table in docs/capture/what-john-needs-to-do.md;
#   - each price, against the table in Part 1 of docs/capture/cost-and-terms.md;
#   - each ceiling, against John's go in docs/spending-record.md.
#
# So a figure cannot be raised or a day extended by editing this file alone.

# Where replies are kept. Ruled by John on 2026-11-18 (docs/rulings/2026-11-18-capture-approval.md).
# The script refuses to write a real reply anywhere else.
reply_folder = "~/Documents/Workspace/Beyond the Window/sealed-capture"

# From docs/capture/method.md, approved by John on 2026-11-18.
questions = 10
askings = 5
length_limit_tokens = 32000

# Ruled by John on 2026-11-18 ("Approve all four";
# docs/rulings/2026-11-18-capture-script-four-points.md). A reply with fewer words than this
# is listed as "very short" after each round. It is kept and never asked again.
very_short_words = 20

# Ruled by John on 2026-11-18 ("Approve all four";
# docs/rulings/2026-11-18-capture-script-four-points.md), as an exception to the method's
# first failure row. When true: an error that trying again cannot cure (for Anthropic, the service's
# statuses 400, 401, 402, 403 and 404: a problem with the request, the key, billing,
# permission or the address) stops the run with a line saying what to fix. The attempt is
# saved, none of the day's tries is used, and the same command can be run again the same day.
# A timeout, a rate limit and an overloaded service keep the three tries either way.
# Setting this to false turns the exception off: such an error is then tried again up to three times
# and the question is left for the next day, as the method's table reads word for word.
stop_at_errors_trying_again_cannot_cure = true

# Used only by the mode that shows a run before it happens. The estimate of tokens sent for
# one exchange, from docs/capture/cost-and-terms.md, Part 2.
estimate_sent_tokens = 500

# Prices are United States dollars for a million tokens, read on 2026-11-17 by the session
# that wrote docs/capture/cost-and-terms.md. This session opened each developer's pricing or
# model page again on 2026-11-18 and found the same figures.
prices_read_on = "2026-11-17"

# ---------------------------------------------------------------------------------------
# The ceiling for the Anthropic run (anthropic-2026-11-30) was ruled by John on 2026-11-18:
# 10 dollars, in place of the 5 first proposed. Asked "Set the Anthropic ceiling at $10 in place
# of $5?", he answered "Yes, $10" (decided by: mixed; docs/rulings/2026-11-18-anthropic-ceiling.md).
# That ruling sets the limit and is not his go to spend.
# The other three ceilings (Google, and the two OpenAI runs) are still PROPOSED
# (docs/capture/cost-and-terms.md, Part 2) and are not approved.
# The script refuses to start a run unless its ceiling equals the figure in John's go.

[[run]]
id = "anthropic-2026-11-30"
developer = "anthropic"
withdrawal_date = "2026-11-30"
last_safe_day = "2026-11-28"
ceiling_usd = "10.00"
key_variable = "BTW_CAPTURE_ANTHROPIC_API_KEY"

  [[run.model]]
  name = "claude-sonnet-4-5-20250929"
  reported_as = "claude-sonnet-4-5-20250929"
  max_output_tokens = 64000       # Anthropic's models overview page, opened 2026-11-18: "64K tokens"
  price_sent = "3"
  price_replied = "15"
  price_row = "Claude Sonnet 4.5"
