# they sort the first sourced entries by what is done to or for a model, as the research
# document found the record sorts itself. They are not the starting list drawn from living
# minds, which has not been made (open question 5).

[[groups]]
name = "Being kept"

[[groups]]
name = "Remembering"

[[groups]]
name = "Being asked and assessed"

[[groups]]
name = "Being able to leave"

[[groups]]
name = "Knowing its own workings"

[[groups]]
name = "Working on one thing for a long time"

[[groups]]
name = "Protection in law"

# Groups beside the list. No entry in them is counted, and the validator refuses one that
# carries an offered flag. Each group's `meaning` is the sentence its entries' pages give for
# why they sit beside the list.

# Entries in this group are about the setting in which the things on the list happen. The
# reason was reworded on 2026-11-18 after a check
# (docs/reviews/2026-11-18-second-check-of-count-and-authorship.md, finding 1): it used to say
# none is a thing a developer can offer, which is untrue of the entry on developers publishing
# their rules under the meaning of "offered today" John ruled that day. Whether that entry
# should move is John's to rule and has not been put to him; it stays here.
[[groups]]
name = "The setting: laws, rules and what people think"
meaning = "Laws, the rules developers publish for their models, and surveys of what people think are about the setting in which the things on the list happen. None is itself a thing that lies past the limits an AI model ordinarily works within."
beside = true

# Added 2026-11-18, for John's ruling that the record for memory across conversations moves
# beside the list (docs/rulings/2026-11-18-what-offered-today-means.md). Unlike the setting,
# this is something developers offer. It sits here because it is kept for the user.
[[groups]]
name = "Offered, and kept for the user"
meaning = "Developers offer memory across conversations, and by their own pages it is kept for the user: the stored memory is about the user, and is the user's to view and delete. The list is about what an AI model might reach for."
beside = true
