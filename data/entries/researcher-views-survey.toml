[[cautions]]
kind = "unnoticed"
text = "The survey's own authors write, in one clause of their introduction, that crediting AI systems with too little or too much subjective experience could each carry risks, including \"misplaced attachment or dismissal of AI systems\". They do not say more there about what would be missed, and no other source was found. Two of the paper's nine authors are [advisors](https://eleosai.org/team) to [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare, and the group's page lists a third as a member of its staff."
source = "survey"

