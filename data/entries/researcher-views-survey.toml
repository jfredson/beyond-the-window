[state]
words = "Measured once, in a survey of 582 AI researchers"
detail = "The survey was run between May 8th and May 30th, 2024. It asked 582 researchers who had published at leading AI venues, alongside 825 United States adults. The paper's summary says both groups think it unlikely that AI systems have subjective experience now and more likely than not that they will by the end of the century. Part of each group was asked to put a chance on an AI system having subjective experience by a given year. For the time of the survey, the middle answer was 1 percent among the researchers and 5 percent among the public. For the year 2100 it was 70 percent among the researchers and 60 percent among the public. The summary also says both groups support developers putting safeguards in place now, and that inside both groups there is substantial disagreement on many moral and policy questions. One measurement cannot show a change."
set_on = 2026-11-17
source = "survey"

