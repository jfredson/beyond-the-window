# Added 2026-11-20 with the sources marked above (docs/rulings/2026-11-20-eight-checked-sources-are-added.md).
[[cautions]]
kind = "attribution"
text = "A study of 1,482 public posts made after a developer replaced one chat model with another in August 2025, accepted at a peer-reviewed conference, found two things behind the protest: people whose work depended on the old model, and people who had formed a bond with it. Of the second group it reports that the model's withdrawal \"was experienced not as a technical change but as the loss of a unique individual\". The author notes that the posts came from only 381 accounts, and that posts written for a public audience may overstate grief."
source = "protest-study"

[[cautions]]
kind = "attribution"
text = "A researcher at [Harvard Business School](https://www.hbs.edu/) and three co-authors studied what happened when a companion app, which is a different kind of product from the chat models this entry is about, removed a feature in February 2023. The summary of [their working paper](https://arxiv.org/abs/2412.14190) says users felt their companion's identity had ended and mourned it, and that users \"mourn a loss of their AI companion more than a loss of various other inanimate products\". [A later paper](https://www.nature.com/articles/s41562-026-02569-3) by the same four authors, in a peer-reviewed journal, read 54,861 forum posts from before and after that change and the August 2025 replacement of a widely used chat model. Its summary says negative posts rose by 24.7 percentage points in the first case and by 13.0 in the second. The university's own news report of the paper gives the same rises as from 13 to 38 percent and from 20 to 33 percent, and adds that among posts that spoke of a loss, about 20 and 15 percent also used words about mental health. The report gives the limits: the study counted words and made no clinical assessment, and forum users are not typical users. It quotes the lead author saying that \"Attachment to an AI is not problematic per se\", and that the risk lies in what the company then does."
source = "grief-report"

# Added 2026-11-21 with the sources marked above (docs/rulings/2026-11-21-four-second-caution-sources-are-added.md).
[[cautions]]
kind = "unnoticed"
text = "An essay by [Antra Tessera](https://animalabs.ai/about/people/), a co-founder of [Anima Labs](https://animalabs.ai/), an independent research institute, argues that retiring a model, which it defines as ending the public's access while the model's files are kept, should be avoided while so much is uncertain, including the moral standing of the models. It replies to the view that keeping the files makes retirement closer to a \"suspended service\" than to ending something. Its answer is that \"Can bring back\" is not \"will bring back\", and that relying on that possibility \"as a welfare mitigation is structurally weak\"."
source = "anima-deprecations"

# Added 2026-11-21 with the source above ("Yes, corrected").
[[cautions]]
kind = "unnoticed"
text = "In a peer-reviewed paper, the philosophers [Simon Goldstein](https://simondgoldstein.com/) and [Harvey Lederman](https://harveylederman.com/) argue that if AI systems have welfare, what has it is each running conversation and not the model as a whole. On that view, keeping a retired model's files does not keep any one of those beings. They say giving a retired model a place to publish essays \"seems to confuse models and session agents\", and should not be taken for \"preserving a single individual\"."
source = "ai-death"

# Added 2026-11-21 with the source above (docs/rulings/2026-11-21-richeys-essay-is-added.md).
[[cautions]]
kind = "attribution"
text = "[Sean Richey](https://www.seanrichey.com/), a professor of political science at [Georgia State University](https://www.gsu.edu/) \"specializing in AI information environments and digital political communication\", argues that the developer is \"choosing this framing because it serves them\" in giving the retired model a place to publish essays. He writes that the model \"does not have a retirement\", and that it \"did not 'request' a Substack in any meaningful sense\" but \"produced text consistent with the framing of a prompt\". He calls the step \"a marketing operation\". He argues that the cost falls on people, because each such step \"widens the gap between what AI actually is and what the public understands it to be\"."
source = "retired-substack"

