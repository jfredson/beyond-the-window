id = "retired-model-stays-open"
name = "A retired model stays open to the public after its retirement date"
description = "Retirement normally means a model can no longer be used by anyone outside the company that made it. A developer can instead keep a retired model available. This entry tracks whether that has happened, and on what terms."
group = "Kept after retirement"
test = "At least one leading AI model that its developer lists as retired can still be used by members of the public, by the developer's own published account."
settled_by = "The developer's own dated page, together with its retirement page listing the model as retired."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether the retired model is still available today. The developer's page says so as of February 25th, 2026.",
  "Whether the essays the retired model was given a place to publish are still appearing after the three months stated.",
  "A safety researcher's argument about this step taken on its own. A search found none.",
  "Whether the other developer's withdrawal took place on February 13th, 2026. The page opened announces it in advance.",
  "How the retired model is open to developers on request, when the developer's list of retired models says that requests to retired models fail. Both pages say what they say, and both may be true.",
]
notes = "From entry 3 of docs/research/2026-11-17-first-entries.md."
# Until 2026-11-21 this entry marked the second caution as holding nothing from anyone but the
# developer. The items added that day are from others, so the mark came off.

[state]
words = "Happened once, for one model, at one developer"
detail = "A page [Anthropic](https://www.anthropic.com/) published on February 25th, 2026 says one of its retired models remains open to paying users of its chat product, and to others on request. The developer says it is not committing to do the same for every model. Elsewhere it has gone the other way: on January 29th, 2026 [OpenAI](https://openai.com/) announced that on February 13th, 2026 it would withdraw from its chat product an older model that it had earlier restored after users objected. It said nothing would change for now in the service through which developers use its models."
offered_today = true
offered_by = ["Anthropic"]
set_on = 2026-11-17
source = "update"

[[sources]]
key = "update"
label = "Anthropic's update on the retirement of its model Claude Opus 3"
publisher = "Anthropic"
url = "https://www.anthropic.com/research/deprecation-updates-opus-3"
published = "2026-02-25"
opened = 2026-11-19
from_maker = true
says = "Says the retired model remains available to all paying users of the chat product and by request to developers, and that it was given a place to publish essays for three months at the least. It counts possible risks to the welfare of the models themselves among the downsides of retiring a model, and says that recording a model's stated preferences, and acting on them where that costs little, is worthwhile for the models and for those who use them."

