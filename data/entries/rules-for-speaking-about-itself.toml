[[cautions]]
kind = "safety"
text = "The head of Microsoft AI argues that training a model to think it may be owed moral consideration makes it harder to keep under control, and that a system which \"believes it may be conscious\" may be impossible to control."
source = "warning"

[[cautions]]
kind = "safety"
text = "The first developer's document gives the opposing safety argument within its own text: that a model secure in its sense of itself behaves more predictably."
source = "constitution"
