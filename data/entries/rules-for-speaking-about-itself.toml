[[cautions]]
kind = "attribution"
text = "The head of Microsoft AI argues that training a model on the idea that it may be owed moral consideration makes it harder to keep under control, and that a system which \"believes it may be conscious\" may be impossible to control."
source = "warning"

[[cautions]]
kind = "attribution"
text = "The same essay argues that a model trained on such a document then says what the document says, and that developers and users meet those words \"as if they were spontaneous testimony\". On that argument, a model's words about itself show the rule it was trained on, not what it is."
source = "warning"

[[cautions]]
kind = "safety"
text = "The first developer's document gives the opposing safety argument within its own text: that a model secure in its sense of itself behaves more predictably."
source = "constitution"

[[cautions]]
kind = "unnoticed"
text = "A 2024 report by ten researchers says developers should not train a model simply to deny that an AI system can be conscious. It grants that a developer may have reasonable motives for doing so, among them the worry that people who reject a model's claims now will go on rejecting such claims later, when they are more likely to be true. On the other side it names a \"desensitizing effect\": people who accept that such systems cannot be conscious may stay doubtful later, when doubt is less warranted. The report was led by [the head](https://eleosai.org/team) of [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare, and by one of its advisors. It thanks Anthropic for money toward the early research behind it, calls itself independent, and says one of its authors has since joined Anthropic."
source = "seriously"

[[cautions]]
kind = "unnoticed"
text = "Two philosophers propose that, while experts disagree, language models could be trained to answer questions about their moral standing \"by expressing uncertainty and explaining why\". They write that drawing too little concern has led to harm to animals on a very large scale, that the same mistake could be made with AI systems that matter, and that it may not yet be a major concern for present AI systems, though \"it could become one soon\". One of the two is [an advisor](https://eleosai.org/team) to that research group."
source = "design-policy"

[[cautions]]
kind = "unnoticed"
text = "A 2023 paper notes that a developer can train a model to describe itself in line with the developer's own \"potentially-flawed beliefs about AI consciousness\", and that training a chat product to appeal to users could lead a model to report emotion and consciousness. Its first author now leads a team at Anthropic, and its second now heads that research group."
source = "self-reports"

