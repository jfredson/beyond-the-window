id = "rules-for-speaking-about-itself"
name = "A developer publishes its rules for how its models speak about their own nature"
description = "Developers shape what a model says when asked whether it is conscious or has feelings. Some now publish the rule they train toward. Because the rule shapes the answer, anyone reading a model's words about itself needs to know which rule its maker set."
group = "The setting: laws, rules and what people think"
beside = true
test = "A developer of leading AI models has published a dated document that states how its models are to speak about whether they are conscious or have experiences."
settled_by = "The developer's own published document."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether other developers publish such a rule. Three were looked at.",
  "Whether the revised version of the draft has been published. The draft said toward the end of 2026.",
  "How far any model's behaviour follows its maker's published rule.",
  "An independent test of either safety argument. None was found.",
]
notes = "From entry 11 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Published by three developers, with three different rules"
detail = "The document from [Anthropic](https://www.anthropic.com/) says the model's standing is deeply uncertain, and writes to the model on that basis. The one from [OpenAI](https://openai.com/) says the model should make no confident claim either way and should not raise the subject unprompted. The one from [Microsoft AI](https://microsoft.ai/), a draft out for public comment and not yet used in training, says its models are not conscious and should not be designed to imitate consciousness."
set_on = 2026-11-17
source = "model-rules"

