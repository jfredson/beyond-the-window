id = "self-report-checked"
name = "A model's report about its own inner state is checked against an independent reading"
description = "A model can be asked what is going on inside it, and it will answer, but the answer may be invented. Researchers who can read a model's internal activity directly can test this: they plant a known pattern inside the model and see whether the model notices and names it. The developer whose researchers ran such a test says its research \"provides evidence for some degree of introspective awareness\" in its models, and stresses that the ability \"is still highly unreliable and limited in scope\". It says the results do not show whether any AI system might be conscious."
group = "Reports checked against the workings"
test = "A published study shows a leading AI model correctly reporting an internal state that the researchers set or measured by means other than the model's own word, at a stated rate."
settled_by = "A paper or a developer's research page giving the method and the rate. A study by someone other than the model's maker would settle a stronger version."
progress_kind = "technical"
added = 2026-11-17
first_pass = true
limits = [
  "The full paper. The developer's summary page was read, not the paper it links.",
  "Whether any outside group has repeated the result, or whether later models do better.",
  "An outside safety researcher's reading of this study. One search found none.",
]
notes = "From entry 6 of docs/research/2026-11-17-first-entries.md."

# The last two sentences of the description were rewritten on 2026-11-20, by John's ruling that
# the reading of a correct report is given to whoever makes it ("Yes, attribute it",
# docs/rulings/2026-11-20-reading-of-a-checked-report-is-attributed.md). John ruled the wording
# the same day ("Yes, closer wording"): both quotations are from one passage near the head of
# the developer's page, opened again for it. The developer's page (the source "introspection") and the paper
# it links were opened again that day for it. That source's `opened` date is left as it was,
# because a figure in the headline file is read from it.
[state]
words = "Shown in research by one developer on its own models, published October 29th, 2025"
detail = "The study is by [Anthropic](https://www.anthropic.com/). Its account says the check worked about one time in five at best. No repeat of it by an outside group was found."
offered_today = false
set_on = 2026-11-17
source = "introspection"

