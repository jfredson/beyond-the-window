[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that any such protection would make advanced AI harder to control."
source = "warning"

[[cautions]]
kind = "safety"
text = "A declaration signed by 908 named people and 313 organisations adds that AI systems should not be designed so that they come to deserve personhood."
source = "declaration"

[[cautions]]
kind = "attribution"
text = "A neuroscientist who argues that conscious AI is unlikely, and that nobody should set out to build it, grants part of the opposite case. He writes that he might be wrong, that rights should arguably follow if such systems really were conscious, and that it is reasonable to wonder whether withholding such credit will leave people \"once again on the wrong side of history\". He holds that with AI the mistake is likelier the other way, because people's habits of mind lean toward seeing consciousness in systems that use language. His essay names the head of Microsoft AI among those who have noticed the danger, and the essay by the head of Microsoft AI that is a source here cites two of his works."
source = "mythology"

[[cautions]]
kind = "unnoticed"
text = "Two researchers write in a newspaper that giving AI systems protection from harm should be considered, \"similar to the protections we give to children or pets\". As a warning from the past they give surgery on newborns without anaesthesia, which they say doctors performed until the 1980s, confident that infants could not feel pain. One of the two is also one of the nine authors of [the survey of AI researchers](/list/researcher-views-survey/). Two of the others are [advisors](https://eleosai.org/team) to [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare, and the group's page lists a third as a member of its staff."
source = "safe-bets"

[[cautions]]
kind = "unnoticed"
text = "Two philosophers argue that a wide range of theories of the mind, joined with leading theories of wellbeing, predict that some AI systems that exist today have wellbeing. They say they do not claim to have shown it conclusively. The possibility alone, they write, \"suggests that we are in danger of gravely immoral action\", and they conclude that the regulation of AI should be strengthened to allow for the possibility. The paper lists both at the Center for AI Safety, where the head of [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare, [worked earlier](https://eleosai.org/team)."
source = "wellbeing"

