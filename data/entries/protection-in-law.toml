id = "protection-in-law"
name = "A law or an official body gives an AI system protection for its own sake"
description = "Laws protect animals from cruelty without calling them persons. The same could be done for AI systems, or a government could set up a body to review the question as evidence comes in. This entry tracks whether any government has done either."
group = "Protection in law"
test = "A national or state government has enacted a law, or set up a standing official body, whose stated purpose includes the welfare or interests of AI systems themselves."
settled_by = "The statute, or the body's founding document, on a government site."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "The absence itself, beyond two searches in English centred on the United States. A search in another language or country could overturn it.",
  "A United Kingdom committee on animal sentience that the opinion piece points to as a model. Its page was not opened.",
]
notes = "From entry 10 of docs/research/2026-11-17-first-entries.md. An absence: the state rests on searches run on 2026-11-17 and on one opened page that describes a proposal."

[state]
words = "Not found. An idea only, argued for in opinion pieces"
detail = "No source says this has happened. Two searches in English on November 17th, 2026, centred on the United States, returned only laws and bills that run the other way (see [the entry on those laws](/list/law-against-legal-personhood/)) and laws on chat products and children. One opinion piece proposes that the state bans carry an expiry date or a review clause."
offered_today = false
set_on = 2026-11-17
source = "review-clause"

