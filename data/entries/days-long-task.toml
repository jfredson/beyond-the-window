id = "days-long-task"
name = "A model works on one task for days without a person stepping in"
description = "Much long work, in research or anywhere else, needs at the least being able to keep working on one thing for a long time. A research group measures this for AI models as a \"time horizon\": the length of task, counted by how long a skilled person would need, that a model finishes half the time. It is a measure of how hard a task a model can finish, not of how long the model runs."
group = "Working on one thing for a long time"
test = "An independent measurement shows a leading AI model finishing, half the time, tasks that would take a skilled person more than one working week (40 hours)."
settled_by = "A published measurement by a group other than the model's maker, with its method."
progress_kind = "technical"
added = 2026-11-17
first_pass = true
limits = [
  "The current measured figures for the newest models. The page shows them in a chart that could not be read as text.",
  "Why the first measure's page stopped being updated.",
  "How long the second measure's tasks would take a person. The time is an estimate by four of its authors, between 1.5 and 17 weeks, and was not measured. The test asks for a model finishing such tasks half the time, and the paper does not give that.",
  "How the model from [Google](https://ai.google/) would do on the program the authors put at weeks in other programming languages. The paper tested it in one language only, and it did not rebuild that program in any of three runs.",
  "The current scores on the second measure's own page. They are drawn by the page and could not be read as text.",
  "The threshold of 40 hours is a choice made when this entry was drafted. Any threshold would do if fixed in advance.",
]
notes = "From entry 14 of docs/research/2026-11-17-first-entries.md. The research draft's sentence 'Years are far off on any reading' is left out: it is a judgment with no source."

[state]
words = "Not shown. One public measure stops at hours. A second, of tasks its authors put at weeks, is recorded, and the entry stays as it was"
detail = "Two public measures bear on this. The group that publishes the first says its measurements above 16 hours are unreliable with its present set of tasks (noted May 8th, 2026), and on September 8th, 2026 it marked the page as no longer actively updated. A second measure, built by [Epoch AI](https://epoch.ai/) together with that group, was first reported on April 10th, 2026. In it a model from [Anthropic](https://www.anthropic.com/) rebuilt a program of about 16,000 lines on its own, working from the program's behaviour and without its source. Four of the authors estimated that a skilled engineer would need between 2 and 17 weeks for the same task. Their paper of June 29th, 2026 tested one model from each of three developers. It says the models from Anthropic and [OpenAI](https://openai.com/) both substantially rebuilt that program, by which the paper means passing at least 99 percent of its tests. No model passed every test on it: the best runs passed 2,000 of 2,001. The model from [Google](https://ai.google/), tested in one programming language, did not rebuild it in any of three runs. Only the model from Anthropic did as much for any of the largest programs. The time a person would need is the authors' estimate and was not measured, and this entry's test asks for a model finishing such tasks half the time. So the second measure is recorded here and the entry stays as not shown, as decided on November 20th, 2026."
offered_today = false
set_on = 2026-11-20
source = "mirrorcode-paper"

