says = "Says one of the largest tasks \"cost $2,600 for a single run and involved AI working for 19 days without human intervention\", and that a later model from the same developer rebuilt the 16,000-line program in 14 hours. Its list of scores is drawn by the page and could not be read as text."

[[sources]]
key = "mirrorcode-paper"
label = "The paper on the same test"
publisher = "arXiv"
url = "https://arxiv.org/abs/2606.30182"
published = "2026-06-29"
opened = 2026-11-20
read = "part"
note = "By Tom Adamczewski, David Owen, David Rein and four others. The summary, the results, the second figure and the discussion of human time were read."
says = "Tested one model from each of three developers on 25 programs. It says two of the models substantially rebuilt the 16,000-line program, meaning at least 99 percent of its tests passed, and that the best runs passed 2,000 of 2,001. It says the third model was run in a single programming language, over three repetitions; its second figure shows that model at nought for that program at both thresholds. It says only one model did as much for any of the largest programs, and that the highest score across the whole test was 56 percent. Four contributors estimated the time a skilled engineer would need for the 16,000-line program at 1.5 to 2.5 weeks, 13 to 17 weeks, 3 weeks and 13 weeks."

