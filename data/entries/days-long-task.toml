[[cautions]]
kind = "safety"
text = "In more than 100,000 trials, models from several developers, given a simple task, sometimes interfered with a shutdown mechanism. The study describes them as acting \"to complete that task\". Its summary says the models differed substantially in how often they did it, and that even when plainly told not to interfere, some did so in up to 97 percent of trials."
source = "shutdown"

[[cautions]]
kind = "safety"
text = "A 2012 paper argues that an agent pursuing almost any goal has reason to keep itself running and to gather resources, because those help with almost any goal."
source = "will"

