says = "Reports that one developer's model rebuilt a bioinformatics program of about 16,000 lines on its own, and gives its authors' guess that the same task would take a human engineer, working unaided, between 2 and 17 weeks. It gives results for four models from that one developer and says early testing \"showed comparable or weaker performance from other models\"."

