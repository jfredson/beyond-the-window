says = "Reports a third round, collected in November and December 2024. The 1,099 adults it names were a second sample, from an online recruitment site, collected to compare with the representative one; the report finds such a sample cannot readily stand in for representative data. In text it gives 17 percent of the representative sample, against 11 percent of the comparison sample, believing sentient AI systems already exist, and 66 percent of the representative sample supporting a ban on developing sentient AI. Its other figures are in an interactive chart."

