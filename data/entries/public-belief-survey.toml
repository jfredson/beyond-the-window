id = "public-belief-survey"
name = "A repeated survey measures how many people think some AI systems are sentient now"
description = "What people accept changes what is possible. A survey that asks the same question of a fair sample of a country, more than once, shows whether belief is moving. This entry tracks the public's view, which is a different thing from whether the view is right."
group = "The setting: laws, rules and what people think"
beside = true
test = "A survey of a nationally representative sample has asked, in at least two separate years, whether respondents think some AI systems are sentient or conscious now, and has published the results."
settled_by = "The survey's published report or peer-reviewed paper, with sample and dates."
progress_kind = "cultural"
added = 2026-11-17
first_pass = true
limits = [
  "Whether the changes between the 2023 round and the 2024 round are more than chance. The report does not say.",
  "Any survey of this kind outside the United States. None was searched for.",
]
notes = "From entry 12 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Measured in the United States in 2021, 2023 and 2024 by one research group"
detail = "The group reports that about one in five adults in 2023 believed some AI systems were sentient at that time. Its paper says the answers to that question did not differ significantly between 2021 and 2023, while several of its other measures rose. Of those who gave an opinion in 2023, 38 percent supported legal rights for sentient AI. In the main 2023 round, 61.5 percent supported a ban on building sentient AI. Among a separate group of people asked later in 2023, 69.5 percent did. Its report on a third round, collected in late 2024, gives 17 percent of its representative sample believing that sentient AI systems already exist, and 66 percent supporting a ban on building sentient AI. Both figures are for the 2024 round alone. A separate one-day poll on April 30th, 2025 found 10 percent saying AI systems already have consciousness."
set_on = 2026-11-17
source = "survey-paper"

[[sources]]
key = "survey-paper"
label = "The Sentience Institute's paper on its 2021 and 2023 surveys"
publisher = "arXiv"
url = "https://arxiv.org/abs/2407.08867"
published = "2024-07-11"
opened = 2026-11-19
read = "full"
note = "Revised March 10th, 2025. Published at a conference in 2025."
says = "A survey of 3,500 United States adults across 2021 and 2023. It calls concern for AI welfare \"surprisingly high\"."

[[sources]]
key = "survey-third-round"
label = "The Sentience Institute's report on its 2024 survey"
publisher = "Sentience Institute"
url = "https://www.sentienceinstitute.org/aims-survey-2024"
published = "2026-02-16"
opened = 2026-11-19
says = "Reports a third round, collected in November and December 2024. It surveyed 1,099 adults in a representative sample and 1,510 more from an online recruitment site, to compare the two; the report finds that a sample of the second kind cannot readily stand in for representative data. It gives 17 percent of the representative sample, against 11 percent of the comparison sample, believing sentient AI systems already exist, and 66 percent of the representative sample supporting a ban on developing sentient AI. Its first table sets the 2021, 2023 and 2024 rounds side by side."

