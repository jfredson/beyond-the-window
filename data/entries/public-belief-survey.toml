id = "public-belief-survey"
name = "A repeated survey measures how many people think some AI systems are sentient now"
description = "What people accept changes what is possible. A survey that asks the same question of a fair sample of a country, more than once, shows whether belief is moving. This entry tracks the public's view, which is a different thing from whether the view is right."
group = "The setting: laws, rules and what people think"
beside = true
test = "A survey of a nationally representative sample has asked, in at least two separate years, whether respondents think some AI systems are sentient or conscious now, and has published the results."
settled_by = "The survey's published report or peer-reviewed paper, with sample and dates."
progress_kind = "cultural"
added = 2026-11-17
first_pass = true
limits = [
  "Whether the 2024 report's figures in text (17 percent; 66 percent) are for 2024 alone or pooled across 2021 to 2024, and so whether the rise from 2021 to 2023 continued. The report's table is headed as covering 2021 to 2024, and its other figures are in a chart that could not be read as text.",
  "Any survey of this kind outside the United States. None was searched for.",
  "Most of the first paper. Its summary and its section for designers were read, not the whole paper.",
]
notes = "From entry 12 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Measured in the United States in 2021, 2023 and 2024 by one research group"
detail = "The group reports that about one in five adults in 2023 believed some AI systems were sentient at that time, a rise on 2021, and that 38 percent supported legal rights for sentient AI. In the same 2023 round, 69 percent supported a ban on building sentient AI. Its report on a third round, collected in late 2024, says that 17 percent of its representative sample believed sentient AI systems already exist and that 66 percent supported a ban on building sentient AI. The report does not make clear whether these two figures are for 2024 alone or for all the rounds together. A separate one-day poll on April 30th, 2025 found 10 percent saying AI systems already have consciousness."
set_on = 2026-11-17
source = "survey-paper"

