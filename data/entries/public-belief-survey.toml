[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that public belief in conscious AI is itself the danger, and calls work on model welfare \"both premature, and frankly dangerous\"."
source = "seemingly"

[[cautions]]
kind = "safety"
text = "A declaration that AI should not claim experiences it lacks reports its own poll of 1,004 likely voters. The figures shown on its page concern control and liability, not sentience."
source = "declaration"

[[cautions]]
kind = "attribution"
text = "A neuroscientist who argues that conscious AI is unlikely writes that what people collectively think about consciousness in AI matters whatever the truth is. If people feel that their AI companions really feel things, he writes, their psychological weak points can be exploited and their \"ethical priorities distorted\". His essay names the head of Microsoft AI among those who have noticed the danger."
source = "mythology"

[[cautions]]
kind = "unnoticed"
text = "The survey's own authors tell designers to go carefully because of \"risks of both over- and underattribution\". Of crediting an AI system with too little experience, the harms they name are conflict between advanced AI systems and people, and people harming robots for their amusement."
source = "survey-paper"

[[cautions]]
kind = "unnoticed"
text = "A philosopher names two problems and holds that both must be taken seriously: that very many users will wrongly credit chat products with human-like consciousness, and that some quite unfamiliar form of consciousness might really arise in AI, with no present way of telling. The summary warns that steps against the first can harm work on the second by \"portraying the idea of conscious AI as impossible or inherently unlikely\", and that work on the second can lead more users to credit too much. The writer is one of the ten authors of [a 2024 report](https://arxiv.org/abs/2411.00986) led by the head of [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare."
source = "centrist"

