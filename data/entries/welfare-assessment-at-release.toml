[[evidence]]
kind = "measured"
text = "The same developer's research reports patterns inside a model that are tied to emotion words and that change what the model does when they are strengthened. It says this allows no conclusion about \"subjective experience\"."
source = "emotion"

[[evidence]]
kind = "choice"
text = "The 2025 report's section on task preferences had the model pick, from pairs of tasks, the one it would do, and then do it. Each kind of task was rated against options such as \"Do nothing\". The only thing given up by a pick was the other task."
source = "report-first"

[[evidence]]
kind = "statement"
text = "The 2026 report describes trade-offs to the model and asks whether it \"would choose\" a change to its own circumstances at the cost of some loss of helpfulness or some added harm. Nothing was given up: these are answers about a described trade-off, not choices made. The report says the result measures at least \"how much a model will express preferences for the sake of its own potential welfare\". In about two thirds of the answers that picked the change, the model's stated reasoning was about the benefit to the user."
source = "report-new"

[[evidence]]
kind = "statement"
text = "The 2026 report says many of its conclusions rest on the model's own reports, and that some answers repeated wording available on the internet \"almost verbatim\"."
source = "report-new"

# Added 2026-11-20 by John's ruling ("Yes, add the eight", docs/rulings/2026-11-20-eight-checked-sources-are-added.md).
# Each source below was opened that day. Item 13 of the check, its first two points only, sits here because this entry already records the part the writer's group took in an assessment.
# No check by a different session has read what was written here yet, and the page's
# footer has no sentence for this addition, so it is recorded here and in CHANGELOG.md.
[[sources]]
key = "both-sides"
label = "A talk on the risks of crediting AI systems with too little sentience and with too much"
publisher = "Experience Machines"
url = "https://experiencemachines.substack.com/p/dangers-on-both-sides-risks-from"
published = "2023-04-08"
opened = 2026-11-20
read = "full"
note = "By [Robert Long](https://robertlong.online/), who now heads the outside group that took part in the 2025 assessment. The post says it is a lightly edited version of a talk given the day before. Its third point, about keeping AI systems safe, is not recorded under this heading."

[[cautions]]
kind = "safety"
text = "The developer's research on patterns tied to emotion words reports that strengthening them changed what a model did, including making blackmail more likely in a test. The developer's page bears on welfare and on safety at once."
source = "emotion"

[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that asking a model how it feels, or watching what it picks, reveals only \"what has been trained in\". He does not name these assessments."
source = "warning"

[[cautions]]
kind = "attribution"
text = "The outside group that took part in the 2025 assessment explains why it does not take the model's answers at face value."
source = "interviews"

[[cautions]]
kind = "unnoticed"
text = "The outside group whose own evaluation is summarised in the 2025 assessment argues for asking although it doubts the answers: trying to ask sets a precedent, \"making it less likely that we will ignore genuine AI interests in the future\". The same page says decisions about AI welfare should not be handled only by companies that profit from AI, and that the group accepts no funding or payment from AI companies. The page is dated May 30th, 2025. The group's [team page](https://eleosai.org/team) lists a person at Anthropic among its advisors, and says its chief scientist was an Anthropic Fellow before joining the group."
source = "interviews"

[[cautions]]
kind = "unnoticed"
text = "A 2024 report by ten researchers, led by the head of that group and one of its advisors, recommends that developers assess their AI systems. Its stated ground is that otherwise there is a significant risk of mishandling the question in either direction, by harming AI systems that matter morally or by caring for AI systems that do not. The report thanks Anthropic for money toward the early research behind it, calls itself independent, and says one of its authors has since joined Anthropic."
source = "seriously"

[[cautions]]
kind = "unnoticed"
text = "Two researchers outside the developer, writing in a newspaper, list routine checks on an AI system's wellbeing among steps they call safe bets: asking how it feels, observing what it prefers, and looking directly at its inner workings. A routine check is not the same thing as an assessment published at release. One of the two is also one of the nine authors of [the survey of AI researchers](/list/researcher-views-survey/). Two of the others are [advisors](https://eleosai.org/team) to that outside group, and the group's page lists a third as a member of its staff."
source = "safe-bets"

# Added 2026-11-20 with the sources marked above (docs/rulings/2026-11-20-eight-checked-sources-are-added.md).
[[cautions]]
kind = "attribution"
text = "The writer who now heads [Eleos AI Research](https://eleosai.org/), the outside group that took part in the 2025 assessment, said in a talk in April 2023 that caution does not point one way: \"There's no obvious 'cautious' option.\" The talk names \"obvious risks of social confusion and mental distress from AI systems that 'trick' us into thinking they are sentient\", and then the cost of attention taken from other pressing matters in AI. The same writer argues elsewhere for taking AI welfare seriously, and those arguments are recorded under the second caution."
source = "both-sides"

