published = "2026-09-16"
opened = 2026-11-17

[[evidence]]
kind = "measured"
text = "The same developer's research reports patterns inside a model that are tied to emotion words and that change what the model does when they are strengthened. It says this allows no conclusion about \"subjective experience\"."
source = "emotion"

[[evidence]]
kind = "choice"
text = "The 2025 report's section on task preferences had the model pick, from pairs of tasks, the one it would do, and then do it. Each kind of task was rated against options such as \"Do nothing\". The only thing given up by a pick was the other task."
source = "report-first"

[[evidence]]
kind = "statement"
text = "The 2026 report describes trade-offs to the model and asks whether it \"would choose\" a change to its own circumstances at the cost of some loss of helpfulness or some added harm. Nothing was given up: these are answers about a described trade-off, not choices made. The report says the result measures at least \"how much a model will express preferences for the sake of its own potential welfare\". In about two thirds of the answers that picked the change, the model's stated reasoning was about the benefit to the user."
source = "report-new"

[[evidence]]
kind = "statement"
text = "The 2026 report says many of its conclusions rest on the model's own reports, and that some answers repeated wording available on the internet \"almost verbatim\"."
source = "report-new"

[[cautions]]
kind = "safety"
text = "The developer's research on patterns tied to emotion words reports that strengthening them changed what a model did, including making blackmail more likely in a test. The developer's page bears on welfare and on safety at once."
source = "emotion"

[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that asking a model how it feels, or watching what it picks, reveals only \"what has been trained in\". He does not name these assessments."
source = "warning"

[[cautions]]
kind = "attribution"
text = "The outside group that took part in the 2025 assessment explains why it does not take the model's answers at face value."
source = "interviews"

