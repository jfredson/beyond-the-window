id = "welfare-assessment-at-release"
name = "A welfare assessment is published when a model is released"
description = "Developers publish a report with each major model describing its safety tests. A developer can add a section on the model's possible welfare: how the model describes its situation, what the developer counts as signs of distress in training and use, and what the model picks when given options. This entry tracks whether such sections are published, and whether anyone outside the developer takes part."
group = "Asked and assessed"
test = "A developer has published a welfare assessment in the release report of a leading AI model, in at least two successive releases."
settled_by = "The developer's own dated release reports."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether every release report between May 2025 and November 2026 has a welfare section. Only the first and the newest were opened, so the test, which asks for two releases in a row, is not settled beyond those two.",
  "Whether any outside group took part after 2025.",
  "Whether any other developer's release report has such a section. On November 20th, 2026 the two newest release documents of [OpenAI](https://openai.com/) and of [Google](https://ai.google/) were opened, and none has one. Their earlier reports were not opened here.",
  "Whether other developers study the welfare of their models without publishing an assessment at release. A [Financial Times](https://en.wikipedia.org/wiki/Financial_Times) report of June 2nd, 2026, read in a licensed Spanish copy, says [Google DeepMind](https://deepmind.google/) and two other companies had hired people for research on machine consciousness and AI welfare, on the word of several people familiar with the matter. That is research, and is not an assessment published with a model.",
]
notes = "From entry 5 of docs/research/2026-11-17-first-entries.md. The item of evidence under 'choice', and the first under 'statement', are from the same two reports as cited in entry 7 of that document, which is not built. The 2026 item was under 'choice' until 2026-11-18, when the second check of the records showed that it reports answers to a described trade-off, not a choice made at a cost."

