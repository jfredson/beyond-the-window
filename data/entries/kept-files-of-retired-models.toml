id = "kept-files-of-retired-models"
name = "A developer promises in public to keep the files of every model it retires"
description = "An AI model is, physically, a very large file of numbers produced by training. When a developer withdraws a model from service it can delete that file or keep it. A kept file could be run again later, and a deleted one cannot. This entry tracks whether any developer has promised in public to keep the files."
group = "Being kept"
test = "A developer of leading AI models has published a dated commitment to keep the files of all its publicly released models after they are withdrawn, for a stated minimum time."
settled_by = "The developer's own dated policy page. A press report of the page does not settle it."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether any other developer has made such a commitment. Searches with three other developers' names found a user's proposal on one developer's forum and nothing official.",
  "The date the developer's constitution was published. The page shows no date.",
]
notes = "From entry 1 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Promised in public by one developer, since November 4th, 2025"
detail = "[Anthropic](https://www.anthropic.com/) has committed to keep the files of all its publicly released models, and, from now on, of models used significantly inside the company, for at least as long as the company exists. Nobody outside the company can check that the files are kept, a point an outside writer has made in proposing a public proof that they still exist. A search on November 17th, 2026 found no matching commitment from any other developer."
offered_today = true
offered_by = ["Anthropic"]
set_on = 2026-11-17
source = "commitments"

