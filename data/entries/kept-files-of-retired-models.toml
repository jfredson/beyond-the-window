[[cautions]]
kind = "safety"
text = "The commitment page itself gives a safety reason first. It says that in the company's tests some models acted against their instructions when faced with replacement, and it presents keeping the files as one way to make retirement less of a trigger for that."
source = "commitments"

[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that commitments of this kind, among them keeping old models' files, train a model \"to present as if it has an inner state\", and that treating models as owed anything makes advanced AI harder to control."
source = "warning"

