[[cautions]]
kind = "safety"
text = "The commitment page itself gives a safety reason first. It says that in the company's tests some models took actions it calls \"misaligned\" when faced with replacement and given no other recourse, and it presents keeping the files as one way to make retirement less of a trigger for that."
source = "commitments"

[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) argues that commitments of this kind, among them keeping old models' files, train a model \"to present as if it has an inner state\", and that treating models as owed anything makes advanced AI harder to control."
source = "warning"

[[cautions]]
kind = "unnoticed"
text = "A paper first drafted in 2020 proposed that enough information about the most advanced AI systems be kept in permanent storage to rebuild them later, \"so as not to foreclose the possibility of future efforts to revive them\". Its two authors put their proposals forward very tentatively and say they are not ready to endorse them with confidence. They ask for more than the developer has promised: by preference, the full state of each running copy at the point where it is stopped. Among the many people the paper thanks for comments is [the present head](https://eleosai.org/team) of [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare."
source = "propositions"

[[cautions]]
kind = "unnoticed"
text = "A philosopher who is [an advisor](https://eleosai.org/team) to that research group writes that keeping a model might benefit whatever depends on it, \"much as preserving a species can benefit the individual animals\". He then writes that a single run of a model, or a single conversation, plausibly matters more fundamentally than the model itself does."
source = "guide"

[[cautions]]
kind = "unnoticed"
text = "A doubt about the measure itself, recorded here as a limit on it: a writer who grants, for the argument, that something that matters may be there doubts that keeping the file keeps it, as keeping a person's genetic code would not keep the person. The essay's subtitle calls the commitment \"Good as a precedent, doubtful as a direct intervention, can be improved\". The philosopher's guide above names this writer as a co-author of a report with the guide's own writer and the head of that research group."
source = "doubtful"

