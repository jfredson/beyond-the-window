[[cautions]]
kind = "safety"
text = "The developer's page that sets out the interviews gives safety as the first downside of retiring models: in its safety tests, some models took actions the developer calls \"misaligned\" when faced with being replaced. The page presents shaping retirement \"in ways that models are less likely to find concerning\" as one way to lower that risk."
source = "commitments"

[[cautions]]
kind = "attribution"
text = "The head of [Microsoft AI](https://microsoft.ai/) names this interview as an example of treating models as owed consideration, and argues that doing so makes advanced AI harder to keep under control."
source = "warning"

[[cautions]]
kind = "attribution"
text = "The same essay argues that a developer which trains a model on text about its possible moral standing, and then takes the model's words as evidence, is reasoning in a circle."
source = "warning"

[[cautions]]
kind = "attribution"
text = "An outside research group that ran welfare interviews with one model reports that what the model said about itself swung with how the question was framed, which it calls \"extreme suggestibility\"."
source = "interviews"

# Added 2026-11-21 with the sources marked above (docs/rulings/2026-11-21-four-second-caution-sources-are-added.md).
[[cautions]]
kind = "unnoticed"
text = "An essay by [Antra Tessera](https://animalabs.ai/about/people/), a co-founder of [Anima Labs](https://animalabs.ai/), an independent research institute that argues for keeping retired models available, calls the developer's commitment to interview models before retiring them welcome in direction. It says the results are \"strongly sensitive to the interviewer technique\". The developer reported that one model was generally neutral about its retirement, while in the institute's own interviews, run by three AI models acting as interviewers, the same model had the highest score for aversion to retirement of the fourteen it studied. The essay takes the gap as a sign that how a model is asked shapes its answer. Neither set of answers is counted here as evidence of what a model wants."
source = "anima-deprecations"

[[cautions]]
kind = "unnoticed"
text = "[Zvi Mowshowitz](https://en.wikipedia.org/wiki/Zvi_Mowshowitz), a writer on AI with no stated tie to any developer, called the developer's commitments \"excellent first steps\" the day after they appeared, and wrote that \"There remains much more to be done\". He reported other people's doubts that a model would speak freely to the developer's own staff, and wrote that the interviews should be set up \"so the AIs being interviewed have no incentive to mask or hide\", and joined with many conversations held outside the developer. He wrote that he is \"always hesitant to assume\" that the version of a model outside users meet is the real one and the developer's is not, since both are particular settings. He also wrote that \"assuming the models and their preferences carry zero moral weight is a clear mistake\"."
source = "zvi-preservation"

