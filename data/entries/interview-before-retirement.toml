id = "interview-before-retirement"
name = "A model is interviewed before it is retired, and the record is kept"
description = "When a developer is about to withdraw a model, it can first run sessions in which staff ask the model about its development, its use, and what it would say about how later models are built. The answers are saved with the model's files. Whether such answers mean anything is disputed. This entry tracks only whether the practice exists."
group = "Being asked and assessed"
test = "A developer has published that it interviewed a named model before that model's retirement and kept the record, and has done so for at least one model under a standing commitment and not as a one-off."
settled_by = "The developer's own dated page naming the model and the retirement date."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether each model retired after January 5th, 2026 was interviewed. The developer's retirement page lists six, and the commitment says they would be. No page was found reporting each one.",
]
notes = "From entry 2 of docs/research/2026-11-17-first-entries.md."
only_the_developer = ["unnoticed"]

[state]
words = "Done by one developer, first in full for a model retired on January 5th, 2026"
detail = "[Anthropic](https://www.anthropic.com/) reported on November 4th, 2025 a trial run with one model before its retirement, and then the first full run for a model retired on January 5th, 2026. The developer says it does not commit to act on what is said. The developer has published short quoted passages and not the full records. Neither page says whether anyone outside the developer has read them."
offered_today = true
offered_by = ["Anthropic"]
set_on = 2026-11-17
source = "update"

[[sources]]
key = "commitments"
label = "Anthropic's page on what it commits to when it retires a model"
publisher = "Anthropic"
url = "https://www.anthropic.com/research/deprecation-commitments"
published = "2025-11-04"
opened = 2026-11-19
from_maker = true
says = "Commits to interview each model when it is to be withdrawn and to keep a record of everything it says, and reports a trial with the model Claude Sonnet 3.6. It lists four downsides of retiring a model. The last, which it marks as the most speculative, is that models might have morally relevant preferences or experiences that retirement affects. It says it thinks it worthwhile, at the least, to give models a way to state such preferences and to keep a record of them."

