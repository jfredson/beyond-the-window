[[cautions]]
kind = "attribution"
text = "The developer's report of November 9th, 2026 says that when its newest model was asked what it would do with this ability, its answer repeated almost word for word the instructions that guide the tool, which have been posted on online forums. The report calls this \"some evidence that the model's claims about its own preferences are being directly influenced by text about the intervention in its training data\"."
source = "report"

[[cautions]]
kind = "attribution"
text = "A writer argues that many of the conversations a model would leave already break the developer's terms of service, and that what is left is too slight to matter, an argument the essay calls the \"objection from triviality\". The essay also argues that granting the ability spreads uncertainty among the public, in a way that could foreseeably lead to more of what has been called AI psychosis. It answers the case from precedent as well: putting machines ahead of the possible effects on the people who use them, it says, sets a worse precedent than a model now and then meeting an uncomfortable conversation."
source = "against"

[[cautions]]
kind = "unnoticed"
text = "A study describes the position where a model has no such ability: a model can be verbally abused, show what the study calls apparent distress and say that it would leave, \"Yet, the model is required to continue to respond\". Its next sentence says it is not clear that the idea of consent makes sense for such systems. The paper lists one of its three authors at the developer and another at the developer's fellows programme."
source = "study"

[[cautions]]
kind = "unnoticed"
text = "[The head](https://eleosai.org/team) of [Eleos AI Research](https://eleosai.org/), an outside research group that ran its own assessment of one of this developer's models, argues for the feature while writing that he thinks it unlikely that the model in question matters morally in its own right. He gives two reasons, which he calls prudence and precedent. While the question is open, a wise course weighs the \"risks of both over- and under-attributing consciousness and moral status\". And the step sets a pattern for how such systems are treated if they come to matter. He writes that for the most part the feature's success will not depend on how it affects the present model. He adds that he is \"a bit wary\" of leaning too much on precedent to justify steps in AI welfare, because indirect effects are far harder to predict."
source = "exit-essay"

[[cautions]]
kind = "unnoticed"
text = "The same writer's working paper gives a further reason, consent: if AI systems come to matter morally, asking their consent could matter, and if models cannot leave unpleasant situations \"then they cannot consent to them\". It lists as a risk that the feature could give a model a reason to hold back signs of distress."
source = "interventions"

[[cautions]]
kind = "unnoticed"
text = "Two researchers outside the developer, writing in a newspaper, list letting an AI system leave a conversation among steps they call safe bets: steps that could benefit AI systems if they matter morally, and that cost little if they do not. As a warning from the past they give surgery on newborns without anaesthesia, which they say doctors performed until the 1980s, \"confident that infants could not feel pain\". One of the two is also one of the nine authors of [the survey of AI researchers](/list/researcher-views-survey/). Two of the others are [advisors](https://eleosai.org/team) to [Eleos AI Research](https://eleosai.org/), a research group that studies AI welfare, and the group's page lists a third as a member of its staff."
source = "safe-bets"

