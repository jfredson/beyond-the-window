id = "ending-a-conversation"
name = "A model can end a conversation itself"
description = "In an ordinary chat product the person can close the conversation and the model has no way to. A developer can give the model a way to close the conversation, after which the person cannot send more messages in it. The person can still start a new conversation at once, and can edit an earlier message in the ended conversation to carry on from that point in a new version of the conversation. This entry tracks whether any model in public use has that."
group = "Ending a conversation"
test = "A leading AI model in public use can end a conversation by its own action, as stated on its developer's own page."
settled_by = "The developer's own dated product or research page."
progress_kind = "technical"
added = 2026-11-17
first_pass = true
limits = [
  "Which models have the ability today. The 2025 page names two models, and both have since been retired.",
  "Whether, at a second developer, it is the AI model that ends the conversation. [OpenAI](https://openai.com/) said on October 30th, 2026 that its chat product would be able to end a chat automatically when a conversation shows signs that someone is fixating on violence, and its help page, read on November 20th, 2026, says this is enabled for personal accounts and is not yet switched on for every account. It is counted here as offered since November 20th, 2026. What this entry's test asks for is an AI model ending a conversation by its own action. The developer's two pages say the chat product ends the conversation, automatically and as a safety step, and do not say whether the model itself makes that decision. For a third developer, two searches on November 20th, 2026 found nothing.",
  "A safety reading of this feature. The developer's page says only that the feature also bears on safeguards, and a search found no safety researcher's argument about it.",
]
notes = "From entry 4 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Offered by two developers, the first since August 15th, 2025"
detail = "[Anthropic](https://www.anthropic.com/) gave the ability to models in its consumer chat product, for rare cases, as a last resort after repeated attempts to redirect the conversation have failed or when the person explicitly asks for the conversation to be ended, and not where a person may be at risk. The developer's report of November 9th, 2026 refers to the tool as still in use. A separate study, outside any product, has measured how often several developers' models chose an option described to them as leaving the conversation. In that study nothing ended, and the models were told so. Since November 20th, 2026 a second developer is counted here. [OpenAI](https://openai.com/) said on October 30th, 2026 that its chat product would be able to end a chat automatically when a conversation shows signs that someone is fixating on violence, and its help page, read on November 20th, 2026, says this is enabled for personal accounts and is not yet switched on for every account. Both pages name the chat product as what ends the conversation, describe it as an automatic safety step, and give the safety of people as the reason. Neither page says that the AI model itself decides to end the conversation, and neither says anything about the model's own interests."
offered_today = true
offered_by = ["Anthropic", "OpenAI"]
set_on = 2026-11-20
source = "ending"

