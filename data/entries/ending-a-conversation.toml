id = "ending-a-conversation"
name = "A model can end a conversation itself"
description = "In an ordinary chat product the person can leave and the model cannot. A developer can give the model a way to close the conversation, after which the person cannot send more messages in it. The person can still start a new conversation at once, and can edit an earlier message in the ended conversation to carry on from that point in a new version of the conversation. This entry tracks whether any model in public use has that."
group = "Being able to leave"
test = "A leading AI model in public use can end a conversation by its own action, as stated on its developer's own page."
settled_by = "The developer's own dated product or research page."
progress_kind = "technical"
added = 2026-11-17
first_pass = true
limits = [
  "Which models have the ability today. The 2025 page names two models, and both have since been retired.",
  "Whether any other developer offers it. One search found none.",
  "A safety reading of this feature. The developer's page says only that the feature also bears on safeguards, and a search found no safety researcher's argument about it.",
  "Most of the study. Its summary and its section on why to study the question were read, not the whole paper.",
]
notes = "From entry 4 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Offered by one developer, since August 15th, 2025"
detail = "[Anthropic](https://www.anthropic.com/) gave the ability to models in its consumer chat product, for rare cases, as a last resort after repeated attempts to redirect the conversation have failed or when the person explicitly asks for the conversation to be ended, and not where a person may be at risk. The developer's report of November 9th, 2026 refers to the tool as still in use. A separate study has tested the same option on several developers' models outside any product."
offered_today = true
offered_by = ["Anthropic"]
set_on = 2026-11-17
source = "ending"

