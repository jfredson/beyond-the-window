id = "memory-across-conversations"
name = "What a model learned in one conversation is carried into the next"
description = "By default a chat model starts every conversation knowing nothing of earlier ones. Developers now offer memory: notes or summaries of past conversations are stored and given back to the model later. The stored memory is about the user, and is the user's to view and delete."
group = "Offered, and kept for the user"
beside = true
test = "A leading AI model in a public product can draw on what was said in earlier conversations with the same person, as stated on its developer's own page."
settled_by = "The developer's own dated product page."
progress_kind = "technical"
added = 2026-11-17
first_pass = true
limits = [
  "How any of the three works today. The pages read are from 2024 and 2025.",
  "A safety researcher's published argument about memory carried across conversations. One search found none.",
  "Whether a kind of memory kept for the AI model itself is offered by any developer. None was found in the pages read. If one is found, it would be a new entry.",
]
notes = "From entry 8 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Offered by at least three developers, the first since February 13th, 2024"
detail = "[OpenAI](https://openai.com/) announced it on February 13th, 2024, [Google](https://ai.google/) by March 13th, 2025, and [Anthropic](https://www.anthropic.com/) on September 11th, 2025. In every case the memory is described as a convenience for the user, under the user's control. Nothing in the pages read presents it as kept for the model."
set_on = 2026-11-17
source = "memory-first"

