id = "law-against-legal-personhood"
name = "A law says an AI system cannot be a legal person"
description = "A \"legal person\" is anything the law lets hold rights and duties: people, companies, governments. A legislature can write into law that an AI system is never one. Several United States states have. Most of these laws also cover animals, rivers and objects, and some were written before chat models existed."
group = "The setting: laws, rules and what people think"
beside = true
test = "A jurisdiction has enacted a statute that excludes artificial intelligence from legal personhood."
settled_by = "The statute on the legislature's own site, or the legislature's own bill page showing it signed."
progress_kind = "political"
added = 2026-11-17
first_pass = true
limits = [
  "Whether the Oklahoma bill became law. Its page shows no action after April 21st, 2026.",
  "Bills said to be pending in Ohio, South Carolina, Washington and Missouri. None was opened.",
  "A court challenge to the Utah law, reported in an opinion piece. No court record was opened.",
  "The date the North Dakota governor signed the bill. The page cited shows only the date it was filed.",
  "Whether any country outside the United States has a similar statute. None was searched for.",
]
notes = "From entry 9 of docs/research/2026-11-17-first-entries.md."

[state]
words = "Enacted in four United States states, the first in 2022"
detail = "Idaho (2022), North Dakota (signed, and filed with the Secretary of State on April 12th, 2023), Utah (in force May 1st, 2024) and Tennessee (signed April 23rd, 2026). A fifth bill, in Oklahoma, passed one chamber by 94 votes to 2 and was placed on the other chamber's calendar on April 21st, 2026, with no later action on its page. No enacted law was found that runs the other way."
set_on = 2026-11-17
source = "tennessee"

[[sources]]
key = "idaho"
label = "Idaho Code, section 5-346"
publisher = "Idaho Legislature"
url = "https://legislature.idaho.gov/statutesrules/idstat/title5/t5ch3/sect5-346/"
published = "2022"
opened = 2026-11-17
says = "Environmental elements, artificial intelligence, nonhuman animals and inanimate objects \"shall not be granted personhood\"."

